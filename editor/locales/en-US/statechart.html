<script type="text/html" data-help-name="statechart-machine">
  <p>Defines a state chart (SCXML 1.0). One config node owns one session; a
  <code>statechart-hub</code> references it and exposes the session to the flow.</p>
  <p>The SCXML text is parsed and compiled in Node.js. The default <b>sandboxed</b>
  engine uses QuickJS with script timeouts; <b>trusted</b> is only for charts you trust.</p>
  <p>Active states are always reported as an array; parallel machines may have
  several active states.</p>
</script>

<script type="text/html" data-help-name="statechart-hub">
  <p>Hosts one state chart in the flow: one input, three outputs.</p>
  <p>Input accepts <code>msg.event</code> / <code>msg.topic</code> events, plus
  <code>msg.command = "set" | "reset" | "read"</code>. Output 1 is state and
  variables, output 2 is chart <code>&lt;send&gt;</code> events, output 3 is
  errors and the final <code>done</code> message.</p>
  <p>A state chart can be hosted by only one hub. A second hub is rejected at
  runtime with an error; remove the first hub and redeploy before switching.</p>
</script>

<script type="text/html" data-help-name="statechart-event">
  <p>Produces an event message for a hub: fixed or <code>msg.event</code> name,
  and no data, <code>msg.payload</code>, fixed JSON, or flow/global context data.</p>
</script>

<script type="text/html" data-help-name="statechart-set">
  <p>Produces a <code>set</code> command for a hub. Set one variable from
  payload/JSON/flow/global, or set several from a <code>msg.payload</code> object.</p>
</script>

<script type="text/html" data-help-name="statechart-read">
  <p>Reads a snapshot, state, or variable from a hub/machine and can copy the
  value to flow/global context. If Machine is empty, the incoming
  <code>msg.states</code>/<code>msg.vars</code> are used.</p>
</script>

<script type="text/html" data-help-name="statechart-reset">
  <p>Produces a <code>reset</code> command for a hub, recreating the session at
  its initial state.</p>
</script>
