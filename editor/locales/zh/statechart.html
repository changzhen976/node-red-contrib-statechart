<script type="text/html" data-help-name="statechart-machine">
  <p>定义状态机（SCXML 1.0）。一个配置节点拥有一个独立会话，由
  <code>statechart-hub</code> 引用并接入 flow。</p>
  <p>默认 <b>sandboxed</b> 引擎使用 QuickJS，带脚本超时；<b>trusted</b>
  仅用于可信状态图。</p>
  <p>活动状态始终以数组报告；并行状态机可能同时有多个活动状态。</p>
</script>

<script type="text/html" data-help-name="statechart-hub">
  <p>把一台状态机接入 flow：一个输入、三个输出。</p>
  <p>输入接受 <code>msg.event</code> / <code>msg.topic</code> 事件，以及
  <code>msg.command = "set" | "reset" | "read"</code>。输出 1 是状态与变量，
  输出 2 是图内 <code>&lt;send&gt;</code> 事件，输出 3 是错误与最终
  <code>done</code> 消息。</p>
  <p>一台状态机只能由一个 Hub 占用；第二个 Hub 会在运行时红灯报错。</p>
</script>

<script type="text/html" data-help-name="statechart-event">
  <p>为 Hub 产生事件消息：事件名可固定或来自 <code>msg.event</code>；
  数据可为空、<code>msg.payload</code>、固定 JSON 或 flow/global context。</p>
</script>

<script type="text/html" data-help-name="statechart-set">
  <p>为 Hub 产生 <code>set</code> 命令。可设置单个变量（payload/JSON/flow/global），
  也可用 <code>msg.payload</code> 对象一次设置多个变量。</p>
</script>

<script type="text/html" data-help-name="statechart-read">
  <p>读取状态机快照、状态或变量，并可写入 flow/global context。Machine 留空时
  使用输入消息中的 <code>msg.states</code>/<code>msg.vars</code>。</p>
</script>

<script type="text/html" data-help-name="statechart-reset">
  <p>为 Hub 产生 <code>reset</code> 命令，把会话恢复到初始状态。</p>
</script>
