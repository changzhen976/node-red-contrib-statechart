<style>
  .scxml-source {
    width: 100%;
    min-height: 220px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre;
  }
  .scxml-help code { font-size: 12px; }

  .scxml-full-editor-callout {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    margin: 2px 0 10px;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    background: #eff6ff;
  }
  .scxml-full-editor-text { flex: 1; min-width: 0; }
  .scxml-full-editor-text strong { display: block; font-size: 12px; color: #1e3a8a; }
  .scxml-full-editor-text span { display: block; font-size: 11px; color: #475569; }
  .scxml-full-editor-callout .red-ui-button { white-space: nowrap; }

  .scxml-editor-toolbar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 6px 0;
  }
  .scxml-section-title { font-weight: 600; margin-left: 10px; }
  .scxml-table-wrap {
    max-height: 220px;
    overflow: auto;
    border: 1px solid #d5dbe6;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .scxml-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .scxml-table th, .scxml-table td {
    padding: 3px;
    border-bottom: 1px solid #e7ebf2;
    vertical-align: top;
  }
  .scxml-table th { background: #f3f6fa; font-weight: 600; white-space: nowrap; }
  .scxml-table input, .scxml-table select, .scxml-table textarea {
    width: 100%;
    box-sizing: border-box;
    font-size: 11px;
    padding: 3px;
  }
  .scxml-table textarea { min-height: 26px; resize: vertical; }
  .scxml-delete {
    border: 0;
    background: transparent;
    color: #b91c1c;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  .scxml-action-cell { display: flex; align-items: flex-start; gap: 2px; }
  .scxml-action-cell textarea { flex: 1; }
  .scxml-edit-actions {
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
    line-height: 1;
    padding: 3px 5px;
  }
  .scxml-edit-actions:hover { background: #e2e8f0; }
  .scxml-action-dialog {
    width: 560px;
    max-width: 92vw;
    border: 1px solid #94a3b8;
    border-radius: 6px;
    padding: 0;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .scxml-action-dialog::backdrop { background: rgba(15,23,42,.35); }
  .scxml-action-head { padding: 10px 12px; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
  .scxml-action-rows { max-height: 55vh; overflow: auto; padding: 8px 12px; }
  .scxml-action-row { border: 1px solid #e2e8f0; border-radius: 4px; padding: 6px; margin-bottom: 6px; }
  .scxml-action-row-head { display: flex; gap: 6px; align-items: center; }
  .scxml-action-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin-top: 4px; }
  .scxml-action-fields label { font-size: 11px; color: #475569; }
  .scxml-action-fields input, .scxml-action-fields textarea { width: 100%; box-sizing: border-box; font-size: 11px; }
  .scxml-action-fields .wide { grid-column: 1 / -1; }
  .scxml-action-footer { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #e2e8f0; align-items: center; }
  .scxml-action-footer .scxml-action-spacer { flex: 1; }
  .scxml-advanced { margin-top: 8px; }
  .scxml-advanced summary { cursor: pointer; color: #6b7280; font-size: 12px; }
  #scxml-doc-json { width: 100%; min-height: 120px; font-family: monospace; font-size: 11px; }
  .scxml-errors {
    border: 1px solid #fca5a5;
    background: #fef2f2;
    color: #991b1b;
    border-radius: 4px;
    padding: 6px 8px;
    margin: 4px 0 8px;
    font-size: 11px;
  }
  .scxml-errors ul { margin: 4px 0 0 18px; padding: 0; }
  .scxml-errors li.warning { color: #92400e; }
  .scxml-visibility-notice { color: #1e40af; margin-bottom: 4px; }
  .scxml-table tr.scxml-row-error input,
  .scxml-table tr.scxml-row-error select,
  .scxml-table tr.scxml-row-error textarea { border-color: #dc2626 !important; }
  .scxml-table tr.scxml-row-warning input,
  .scxml-table tr.scxml-row-warning select,
  .scxml-table tr.scxml-row-warning textarea { border-color: #d97706 !important; }



  /* Keep the sidebar drag handle above the monitor iframe, and allow the
     sidebar content to shrink below its intrinsic content width. */
  #red-ui-sidebar-separator { z-index: 20; }
  #red-ui-sidebar-separator .red-ui-sidebar-separator-handle { width: 14px; }
  #red-ui-sidebar .red-ui-sidebar-content,
  #red-ui-sidebar .red-ui-sidebar-section { min-width: 0; }
  #red-ui-sidebar iframe { display: block; min-width: 0; }
  /* While dragging the divider, stop the monitor iframe from swallowing
     mousemove events as the pointer enters the sidebar. */
  body.scxml-sidebar-resizing #red-ui-sidebar iframe { pointer-events: none !important; }
</style>

<!-- SCXML_CORE_INLINE -->

<script type="text/javascript">

  var SCXML_NS = '@changzhen976/node-red-contrib-statechart/statechart';
  function scxmlI18n(key, opts) { return RED._(SCXML_NS + ':' + key, opts); }

  RED.nodes.registerType('statechart-machine', {
    category: 'config',
    color: '#7c3aed',
    icon: 'statechart.svg',
    defaults: {
      name: { value: scxmlI18n('label.scxmlMachine') },
      source: { value: '' },
      doc: { value: '' },
      engine: { value: 'sandboxed' },
      scriptTimeoutMs: { value: 500, validate: RED.validators.number() },
      maxMicrosteps: { value: 10000, validate: RED.validators.number() },
      monitorShowVars: { value: false },
      persistVars: { value: false },
      updateEvent: { value: 'update' }
    },
    label: function () {
      return this.name || scxmlI18n('label.scxmlMachine');
    },
    inputs: 0,
    outputs: 0,
    oneditprepare: function () {
      var id = this.id;
      $('#node-config-input-open-sidebar').on('click', function (event) {
        event.preventDefault();
        scxmlFetchToken(function () {
          var url = scxmlMonitorUrl(true, id);
          if (typeof scxmlSidebarFrame !== 'undefined' && scxmlSidebarFrame) {
            scxmlSidebarFrame.attr('src', url);
          }
          if (RED.sidebar && RED.sidebar.show) {
            RED.sidebar.show('scxml-monitor');
          } else {
            window.open(url, '_blank');
          }
        });
      });
      if (typeof scxmlPrepareMachineEditor === 'function') scxmlPrepareMachineEditor(this);
    },
    oneditsave: function () {
      if (typeof scxmlSaveMachineEditor === 'function') scxmlSaveMachineEditor(this);
    }
  });

  RED.nodes.registerType('statechart-hub', {
    category: scxmlI18n('category'),
    color: '#7c3aed',
    icon: 'statechart.svg',
    paletteLabel: scxmlI18n('label.scxmlHub'),
    defaults: {
      name: { value: '' },
      machine: { value: '', type: 'statechart-machine' },
      includeVars: { value: true },
      emitInitial: { value: true },
      includeInternalSends: { value: false },
      stateTopic: { value: '' },
      eventTopic: { value: 'statechart/{machine}/evt/{event}' }
    },
    label: function () {
      return this.name || scxmlI18n('label.scxmlHub');
    },
    outputLabels: function (index) {
      return [scxmlI18n('label.hubState'), scxmlI18n('label.hubEvents'), scxmlI18n('label.hubErrors')][index] || '';
    },
    inputs: 1,
    outputs: 3,
    oneditprepare: function () {
      var self = this;
      var others = [];
      if (RED.nodes && RED.nodes.eachNode) {
        RED.nodes.eachNode(function (n) {
          if (n.type === 'statechart-hub' && n.machine === self.machine && n.id !== self.id) {
            others.push(n.name || n.id);
          }
        });
      }
      var $warning = $('#node-input-hub-warning');
      if (others.length) {
        $warning.text(scxmlI18n('form.hubConflictWarning', { name: others[0] })).show();
      } else {
        $warning.hide();
      }
    }
  });

  RED.nodes.registerType('statechart-event', {
    category: scxmlI18n('category'),
    color: '#0ea5e9',
    icon: 'statechart.svg',
    paletteLabel: scxmlI18n('label.scxmlEvent'),
    defaults: {
      name: { value: '' },
      event: { value: '' },
      eventSource: { value: 'fixed' },
      dataMode: { value: 'none' },
      data: { value: '' },
      dataKey: { value: '' }
    },
    label: function () {
      return this.name || this.event || scxmlI18n('label.scxmlEvent');
    },
    inputs: 1,
    outputs: 1,
    oneditprepare: function () {
      var toggle = function () {
        var mode = $('#node-input-dataMode').val();
        $('#node-input-data').closest('.form-row').toggle(mode === 'json');
        $('#node-input-dataKey').closest('.form-row').toggle(mode === 'flow' || mode === 'global');
        $('#node-input-event').closest('.form-row').toggle($('#node-input-eventSource').val() !== 'msg.event');
      };
      $('#node-input-dataMode, #node-input-eventSource').on('change', toggle);
      toggle();
    }
  });

  RED.nodes.registerType('statechart-set', {
    category: scxmlI18n('category'),
    color: '#16a34a',
    icon: 'statechart.svg',
    paletteLabel: scxmlI18n('label.scxmlSet'),
    defaults: {
      name: { value: '' },
      mode: { value: 'single' },
      variable: { value: '' },
      valueType: { value: 'payload' },
      value: { value: '' },
      valueKey: { value: '' }
    },
    label: function () {
      return this.name || (this.variable ? this.variable + ' = …' : scxmlI18n('label.scxmlSet'));
    },
    inputs: 1,
    outputs: 1,
    oneditprepare: function () {
      var toggle = function () {
        var single = $('#node-input-mode').val() !== 'object';
        $('#node-input-variable').closest('.form-row').toggle(single);
        $('#node-input-valueType').closest('.form-row').toggle(single);
        var vt = $('#node-input-valueType').val();
        $('#node-input-value').closest('.form-row').toggle(single && vt === 'json' || single && ['str', 'num', 'bool'].indexOf(vt) >= 0);
        $('#node-input-valueKey').closest('.form-row').toggle(single && (vt === 'flow' || vt === 'global'));
      };
      $('#node-input-mode, #node-input-valueType').on('change', toggle);
      toggle();
    }
  });

  RED.nodes.registerType('statechart-read', {
    category: scxmlI18n('category'),
    color: '#0891b2',
    icon: 'statechart.svg',
    paletteLabel: scxmlI18n('label.scxmlRead'),
    defaults: {
      name: { value: '' },
      machine: { value: '', type: 'statechart-machine' },
      mode: { value: 'snapshot' },
      variable: { value: '' },
      scope: { value: 'none' },
      key: { value: '' }
    },
    label: function () {
      return this.name || scxmlI18n('label.scxmlRead');
    },
    inputs: 1,
    outputs: 1,
    oneditprepare: function () {
      var toggle = function () {
        $('#node-input-variable').closest('.form-row').toggle($('#node-input-mode').val() === 'var');
        $('#node-input-key').closest('.form-row').toggle($('#node-input-scope').val() !== 'none');
      };
      $('#node-input-mode, #node-input-scope').on('change', toggle);
      toggle();
    }
  });

  RED.nodes.registerType('statechart-reset', {
    category: scxmlI18n('category'),
    color: '#dc2626',
    icon: 'statechart.svg',
    paletteLabel: scxmlI18n('label.scxmlReset'),
    defaults: {
      name: { value: '' }
    },
    label: function () {
      return this.name || scxmlI18n('label.scxmlReset');
    },
    inputs: 1,
    outputs: 1
  });

  var scxmlRoot = (RED.settings.httpAdminRoot || '/').replace(/\/?$/, '/');
  var scxmlToken = '';
  var scxmlTokenLoading = false;

  function scxmlTokenQuery() {
    return scxmlToken ? '&token=' + encodeURIComponent(scxmlToken) : '';
  }

  function scxmlMonitorUrl(embed, id) {
    var lang = (RED.i18n && RED.i18n.lang && RED.i18n.lang()) || 'zh-CN';
    return scxmlRoot + 'statechart/monitor?embed=' + (embed ? '1' : '0') +
      (id ? '&id=' + encodeURIComponent(id) : '') +
      '&lang=' + encodeURIComponent(lang) + scxmlTokenQuery();
  }

  function scxmlFetchToken(done) {
    if (scxmlToken) { if (done) done(); return; }
    if (scxmlTokenLoading) return;
    scxmlTokenLoading = true;
    $.getJSON('statechart/token')
      .done(function (data) {
        scxmlToken = data && data.token ? String(data.token) : '';
        if (typeof scxmlSidebarFrame !== 'undefined' && scxmlSidebarFrame && scxmlToken) {
          scxmlSidebarFrame.attr('src', scxmlMonitorUrl(true));
        }
        if (done) done();
      })
      .fail(function () {
        RED.notify(scxmlI18n('message.tokenUnavailable'), { type: 'error' });
      })
      .always(function () { scxmlTokenLoading = false; });
  }

  if (RED.sidebar && RED.sidebar.addTab) {
    var scxmlSidebarFrame = $('<iframe>')
      .attr('title', scxmlI18n('sidebar.title'))
      .attr('src', 'about:blank')
      .css({ border: '0', width: '100%', height: '100%', minWidth: 0, display: 'block' });
    var monitorContent = $('<div>')
      .css({ height: '100%', width: '100%', minWidth: 0, overflow: 'hidden' })
      .append(scxmlSidebarFrame);
    RED.sidebar.addTab({
      id: 'scxml-monitor',
      label: scxmlI18n('sidebar.label'),
      name: scxmlI18n('sidebar.title'),
      iconClass: 'fa fa-sitemap',
      content: monitorContent,
      onchange: function () {}
    });
    $(document)
      .off('mousedown.scxmlSidebarResize')
      .on('mousedown.scxmlSidebarResize', '#red-ui-sidebar-separator', function () {
        $('body').addClass('scxml-sidebar-resizing');
      })
      .off('mouseup.scxmlSidebarResize pointerup.scxmlSidebarResize')
      .on('mouseup.scxmlSidebarResize pointerup.scxmlSidebarResize', function () {
        $('body').removeClass('scxml-sidebar-resizing');
      });
    $(window).off('blur.scxmlSidebarResize').on('blur.scxmlSidebarResize', function () {
      $('body').removeClass('scxml-sidebar-resizing');
    });
    scxmlFetchToken();
  }

</script>

<script type="text/javascript">
(function () {
  'use strict';

  function core() { return window.SCXMLCore; }

  function t(key, opts) {
    return window.scxmlI18n ? window.scxmlI18n(key, opts) : key;
  }

  function notify(message, type) {
    if (window.RED && typeof RED.notify === 'function') {
      RED.notify(message, { type: type || 'warning' });
    } else {
      console.warn('[statechart]', message);
    }
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function lines(text) {
    return String(text || '').split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function stateById(doc, uid) {
    for (var i = 0; i < doc.states.length; i++) if (doc.states[i].uid === uid) return doc.states[i];
    return null;
  }

  /**
   * Materialize the same initial invariant as statechart-kit 0.13's editor:
   * a compound's initial must be one of its direct children, and the root
   * initial must be a top-level state. History pseudo-states are never picked.
   */
  function ensureInitial(doc, parentUid) {
    var c = core();
    if (parentUid) {
      var parent = stateById(doc, parentUid);
      if (!parent || parent.kind !== 'compound') return;
      var children = c.childrenOf(doc, parent.uid);
      if (!children.length) {
        parent.initial = null;
        return;
      }
      if (!parent.initial || !children.some(function (s) { return s.uid === parent.initial; })) {
        var first = null;
        for (var i = 0; i < children.length; i++) {
          if (children[i].kind !== 'history') { first = children[i]; break; }
        }
        parent.initial = first ? first.uid : null;
      }
      return;
    }
    var tops = doc.states.filter(function (s) { return !s.parent && s.kind !== 'history'; });
    if (!doc.initial || !tops.some(function (s) { return s.uid === doc.initial; })) {
      doc.initial = tops.length ? tops[0].uid : null;
    }
  }

  function kindOptions(selected) {
    var kinds = ['atomic', 'compound', 'final', 'parallel', 'history'];
    return kinds.map(function (k) {
      return '<option value="' + k + '"' + (k === selected ? ' selected' : '') + '>' + k + '</option>';
    }).join('');
  }

  function parentOptions(doc, selected, excludeUid) {
    var c = core();
    var excluded = {};
    if (excludeUid) {
      excluded[excludeUid] = true;
      c.descendantsOf(doc, excludeUid).forEach(function (uid) { excluded[uid] = true; });
    }
    var html = '<option value="">' + esc(t('form.root')) + '</option>';
    doc.states.forEach(function (s) {
      if (excluded[s.uid]) return;
      html += '<option value="' + esc(s.uid) + '"' + (s.uid === selected ? ' selected' : '') + '>' + esc(s.id) + '</option>';
    });
    return html;
  }

  function initialOptions(doc, uid, selected) {
    var c = core();
    var children = c.childrenOf(doc, uid);
    var html = '<option value="">' + esc(t('form.none')) + '</option>';
    children.forEach(function (s) {
      html += '<option value="' + esc(s.uid) + '"' + (s.uid === selected ? ' selected' : '') + '>' + esc(s.id) + '</option>';
    });
    return html;
  }

  function stateSelectOptions(doc, selected, allowInternal) {
    var html = '<option value="">' + esc(t('form.pickState')) + '</option>';
    if (allowInternal) {
      html += '<option value="__internal__"' + (selected == null ? ' selected' : '') + '>' + esc(t('form.internalTransition')) + '</option>';
    }
    doc.states.forEach(function (s) {
      html += '<option value="' + esc(s.uid) + '"' + (s.uid === selected ? ' selected' : '') + '>' + esc(s.id) + '</option>';
    });
    return html;
  }

  function actionCell(kind, id, field, value) {
    return '<td><div class="scxml-action-cell">' +
      '<textarea data-field="' + field + '" rows="2">' + esc((value || []).join('\n')) + '</textarea>' +
      '<button type="button" class="scxml-edit-actions" data-kind="' + kind + '" data-id="' + esc(id) + '" data-field="' + field + '" title="' + esc(t('form.editActions')) + '">…</button>' +
      '</div></td>';
  }

  function renderStates(doc) {
    var rows = doc.states.map(function (s) {
      return '<tr data-uid="' + esc(s.uid) + '">' +
        '<td><input data-field="id" value="' + esc(s.id) + '"></td>' +
        '<td><select data-field="kind">' + kindOptions(s.kind) + '</select></td>' +
        '<td><select data-field="parent">' + parentOptions(doc, s.parent, s.uid) + '</select></td>' +
        '<td><select data-field="initial">' + initialOptions(doc, s.uid, s.initial) + '</select></td>' +
        actionCell('state', s.uid, 'entry', s.entryActions || []) +
        actionCell('state', s.uid, 'exit', s.exitActions || []) +
        '<td><button type="button" class="scxml-delete" data-kind="state" data-uid="' + esc(s.uid) + '" title="' + esc(t('form.deleteState')) + '">×</button></td>' +
        '</tr>';
    }).join('');
    return rows || '<tr><td colspan="7" style="color:#888;">' + esc(t('message.noStates')) + '</td></tr>';
  }

  function renderTransitions(doc) {
    var rows = doc.transitions.map(function (edge) {
      return '<tr data-id="' + esc(edge.id) + '">' +
        '<td><select data-field="source">' + stateSelectOptions(doc, edge.source) + '</select></td>' +
        '<td><select data-field="target">' + stateSelectOptions(doc, edge.target, true) + '</select></td>' +
        '<td><input data-field="event" value="' + esc(edge.event) + '"></td>' +
        '<td><input data-field="cond" value="' + esc(edge.cond || '') + '"></td>' +
        actionCell('transition', edge.id, 'actions', edge.actions || []) +
        '<td><input data-field="delayMs" type="number" min="0" value="' + esc(edge.delayMs || '') + '"></td>' +
        '<td><button type="button" class="scxml-delete" data-kind="transition" data-id="' + esc(edge.id) + '" title="' + esc(t('form.deleteTransition')) + '">×</button></td>' +
        '</tr>';
    }).join('');
    return rows || '<tr><td colspan="7" style="color:#888;">' + esc(t('message.noTransitions')) + '</td></tr>';
  }

  /** Event names that can carry an eventVisibility setting. */
  function collectEventNames(doc) {
    var names = {};
    (doc.transitions || []).forEach(function (t) {
      // Delay events are generated by kit and are always external by design.
      if (t.delayMs !== undefined) return;
      String(t.event || '').split(/\s+/).forEach(function (name) {
        if (name) names[name] = true;
      });
    });
    (doc.internalOnlyEvents || []).forEach(function (name) { if (name) names[name] = true; });
    return Object.keys(names).sort();
  }

  function visibilityOptions(selected) {
    return '<option value="both"' + (selected === 'both' ? ' selected' : '') + '>' +
        esc(t('form.visibilityBoth')) + '</option>' +
      '<option value="internal"' + (selected === 'internal' ? ' selected' : '') + '>' +
        esc(t('form.visibilityInternal')) + '</option>';
  }

  function renderEvents(doc) {
    var rows = collectEventNames(doc).map(function (name) {
      var visibility = core().isInternalOnlyEvent(doc, name) ? 'internal' : 'both';
      return '<tr data-event="' + esc(name) + '">' +
        '<td>' + esc(name) + '</td>' +
        '<td><select data-field="visibility">' + visibilityOptions(visibility) + '</select></td>' +
        '</tr>';
    }).join('');
    return rows || '<tr><td colspan="2" style="color:#888;">' + esc(t('message.noEvents')) + '</td></tr>';
  }

  /** Host-level warning: the automatic update event cannot be internal-only. */
  function updateEventIssue(doc, updateEvent) {
    var name = String(updateEvent || '').trim();
    if (!name || !core().isInternalOnlyEvent(doc, name)) return null;
    return { code: 'updateEventInternal', level: 'warning', params: { event: name } };
  }

  function collectIssues(node) {
    var c = core();
    var doc = node._scxmlEditor.doc;
    var issues = c && c.validateDoc ? c.validateDoc(doc).slice() : [];
    var updateEvent = $('#node-config-input-updateEvent').val() || node.updateEvent || 'update';
    var hostIssue = updateEventIssue(doc, updateEvent);
    if (hostIssue) issues.push(hostIssue);
    return issues;
  }

  function renderVars(doc) {
    var rows = (doc.datamodel || []).map(function (v, index) {
      return '<tr data-index="' + index + '">' +
        '<td><input data-field="id" value="' + esc(v.id) + '"></td>' +
        '<td><input data-field="expr" value="' + esc(v.expr || '') + '"></td>' +
        '<td><button type="button" class="scxml-delete" data-kind="var" data-index="' + index + '" title="' + esc(t('form.deleteVariable')) + '">×</button></td>' +
        '</tr>';
    }).join('');
    return rows || '<tr><td colspan="3" style="color:#888;">' + esc(t('message.noVariables')) + '</td></tr>';
  }

  function issueText(issue) {
    return t('validate.' + issue.code, issue.params || {});
  }

  function renderIssues(node) {
    var doc = node._scxmlEditor.doc;
    var issues = collectIssues(node);
    node._scxmlEditor.issues = issues;
    var $box = $('#scxml-editor-errors');
    $box.empty();
    $('#scxml-states-body tr, #scxml-transitions-body tr').removeClass('scxml-row-error scxml-row-warning');
    var internalEvents = core().internalOnlyNames(doc);
    if (!issues.length && !internalEvents.length) {
      $box.attr('hidden', true).hide();
      return;
    }
    if (internalEvents.length) {
      $box.append($('<div>').addClass('scxml-visibility-notice').text(t('message.internalEventsNotice', {
        events: internalEvents.join(', '),
      })));
    }
    if (!issues.length) {
      $box.removeAttr('hidden').show();
      return;
    }
    var $ul = $('<ul>');
    issues.forEach(function (issue) {
      $ul.append($('<li>').addClass(issue.level).text(issueText(issue)));
      if (issue.uid) {
        $('#scxml-states-body tr[data-uid="' + issue.uid + '"]').addClass(issue.level === 'error' ? 'scxml-row-error' : 'scxml-row-warning');
      }
      if (issue.transitionId) {
        $('#scxml-transitions-body tr[data-id="' + issue.transitionId + '"]').addClass(issue.level === 'error' ? 'scxml-row-error' : 'scxml-row-warning');
      }
    });
    $box.append($('<strong>').text(t('message.validationSummary', { count: issues.length }))).append($ul).removeAttr('hidden').show();
  }


  var actionDraft = [];
  var actionContext = null;

  function defaultAction(type) {
    switch (type) {
      case 'send': return { type: 'send', event: '' };
      case 'raise': return { type: 'raise', event: '' };
      case 'cancel': return { type: 'cancel', sendid: '' };
      case 'assign': return { type: 'assign', target: '', expr: '' };
      case 'log': return { type: 'log', expr: '' };
      default: return { type: 'script', code: '' };
    }
  }

  function actionTypeOptions(selected) {
    var types = ['send', 'raise', 'cancel', 'assign', 'log', 'script'];
    return types.map(function (type) {
      return '<option value="' + type + '"' + (type === selected ? ' selected' : '') + '>' +
        esc(t('form.type' + type.charAt(0).toUpperCase() + type.slice(1))) + '</option>';
    }).join('');
  }

  function actionField(labelKey, field, value, wide) {
    return '<label class="' + (wide ? 'wide' : '') + '">' + esc(t(labelKey)) +
      '<input data-afield="' + field + '" value="' + esc(value == null ? '' : value) + '"></label>';
  }

  function actionTextarea(labelKey, field, value) {
    return '<label class="wide">' + esc(t(labelKey)) +
      '<textarea data-afield="' + field + '" rows="3">' + esc(value == null ? '' : value) + '</textarea></label>';
  }

  function actionRow(action, index) {
    var fields = '';
    if (action.type === 'send') {
      fields += actionField('form.actionEvent', 'event', action.event);
      var targets = ['', '#_internal'];
      if (action.target && targets.indexOf(action.target) === -1) targets.push(action.target);
      fields += '<label>' + esc(t('form.actionSendTarget')) + '<select data-afield="target">' +
        targets.map(function (target) {
          var label = target === '' ? t('form.targetExternal')
            : target === '#_internal' ? t('form.targetInternal') : target;
          return '<option value="' + esc(target) + '"' +
            (target === (action.target || '') ? ' selected' : '') + '>' + esc(label) + '</option>';
        }).join('') + '</select></label>';
      fields += actionField('form.actionDelay', 'delay', action.delay);
      fields += actionField('form.actionId', 'id', action.id);
      fields += actionField('form.actionDataExpr', 'dataExpr', action.dataExpr);
      fields += actionField('form.actionData', 'data', action.data === undefined ? '' : JSON.stringify(action.data), true);
    } else if (action.type === 'raise') {
      fields += actionField('form.actionEvent', 'event', action.event);
    } else if (action.type === 'cancel') {
      fields += actionField('form.actionSendId', 'sendid', action.sendid);
    } else if (action.type === 'assign') {
      fields += actionField('form.actionTarget', 'target', action.target);
      fields += actionField('form.actionExpr', 'expr', action.expr, true);
    } else if (action.type === 'log') {
      fields += actionField('form.actionExpr', 'expr', action.expr, true);
    } else if (action.type === 'script') {
      fields += actionTextarea('form.actionCode', 'code', action.code);
    } else {
      // Never silently turn an unknown action into a script: that used to
      // corrupt kit 0.13 `raise` rows into `raise undefined`.
      fields += actionTextarea('form.actionCode', 'code', action.code);
    }
    return '<div class="scxml-action-row" data-index="' + index + '">' +
      '<div class="scxml-action-row-head">' +
        '<select data-afield="type">' + actionTypeOptions(action.type) + '</select>' +
        '<span style="flex:1"></span>' +
        '<button type="button" class="scxml-delete scxml-action-remove" title="' + esc(t('form.deleteAction')) + '">×</button>' +
      '</div>' +
      '<div class="scxml-action-fields">' + fields + '</div>' +
    '</div>';
  }

  function renderActionRows() {
    var rows = actionDraft.map(actionRow).join('');
    $('#scxml-action-rows').html(rows || '<p style="color:#888;font-size:11px;">' + esc(t('message.noActions')) + '</p>');
    $('#scxml-action-error').attr('hidden', true).empty();
  }

  function openActionEditor(node, kind, id, field) {
    var doc = node._scxmlEditor.doc;
    var target = kind === 'state' ? stateById(doc, id) : null;
    if (kind === 'transition') {
      for (var i = 0; i < doc.transitions.length; i++) if (doc.transitions[i].id === id) target = doc.transitions[i];
    }
    if (!target) return;
    var prop = kind === 'state' ? (field === 'entry' ? 'entryActions' : 'exitActions') : 'actions';
    actionDraft = (target[prop] || []).filter(function (line) { return String(line).trim() !== ''; })
      .map(function (line) { return core().parseActionLine(line); });
    actionContext = { node: node, kind: kind, id: id, prop: prop, target: target };
    renderActionRows();
    var dialog = document.getElementById('scxml-action-dialog');
    if (dialog && dialog.showModal) dialog.showModal();
    else if (dialog) dialog.setAttribute('open', '');
    $('#scxml-action-error').attr('hidden', true).empty();
  }

  function closeActionEditor() {
    var dialog = document.getElementById('scxml-action-dialog');
    if (dialog) {
      if (dialog.close) dialog.close();
      else dialog.removeAttribute('open');
    }
    actionContext = null;
  }

  function actionError(message) {
    $('#scxml-action-error').text(message).removeAttr('hidden').show();
  }

  function saveActionEditor() {
    if (!actionContext) return;
    for (var i = 0; i < actionDraft.length; i++) {
      var action = actionDraft[i];
      if (action.type === 'send') {
        if (!String(action.event || '').trim()) { actionError(t('message.actionRequired')); return; }
        if (action.target === '#_internal' && String(action.delay || '').trim()) {
          actionError(t('message.internalDelayUnsupported'));
          return;
        }
        if (action.data !== undefined && action._dataInvalid) { actionError(t('message.actionDataInvalid')); return; }
      } else if (action.type === 'raise') {
        if (!String(action.event || '').trim()) { actionError(t('message.actionRequired')); return; }
      } else if (action.type === 'cancel') {
        if (!String(action.sendid || '').trim()) { actionError(t('message.actionRequired')); return; }
      } else if (action.type === 'assign') {
        if (!String(action.target || '').trim() || !String(action.expr || '').trim()) { actionError(t('message.actionRequired')); return; }
      } else if (action.type === 'log') {
        if (!String(action.expr || '').trim()) { actionError(t('message.actionRequired')); return; }
      } else if (action.type === 'script') {
        if (!String(action.code || '').trim()) { actionError(t('message.actionRequired')); return; }
      } else {
        actionError(t('message.unsupportedAction', { type: action.type || '?' }));
        return;
      }
    }
    var lines = actionDraft.map(function (action) {
      delete action._dataInvalid;
      return core().actionToLine(action);
    }).filter(function (line) { return String(line).trim() !== ''; });
    actionContext.target[actionContext.prop] = lines;
    render(actionContext.node);
    closeActionEditor();
  }

  function bindActionEditor(node) {
    $('#scxml-action-rows').off('.scxml').on('change.scxml', '[data-afield]', function () {
      var index = Number($(this).closest('.scxml-action-row').attr('data-index'));
      var action = actionDraft[index];
      if (!action) return;
      var field = $(this).attr('data-afield');
      var value = $(this).val();
      if (field === 'type') {
        actionDraft[index] = defaultAction(value);
        renderActionRows();
        return;
      }
      if (field === 'data') {
        if (String(value).trim() === '') {
          delete action.data;
          delete action._dataInvalid;
        } else {
          try {
            action.data = JSON.parse(value);
            delete action._dataInvalid;
          } catch (err) {
            action.data = value;
            action._dataInvalid = true;
          }
        }
        return;
      }
      action[field] = value;
    });

    $('#scxml-action-rows').on('click.scxml', '.scxml-action-remove', function (e) {
      e.preventDefault();
      var index = Number($(this).closest('.scxml-action-row').attr('data-index'));
      actionDraft.splice(index, 1);
      renderActionRows();
    });

    $('#scxml-action-add').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      actionDraft.push(defaultAction('assign'));
      renderActionRows();
    });

    $('#scxml-action-save').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      saveActionEditor();
    });

    $('#scxml-action-cancel').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      closeActionEditor();
    });

    $('#scxml-action-dialog').off('.scxml').on('cancel.scxml', function (e) {
      e.preventDefault();
      closeActionEditor();
    });

    $('#scxml-states-body, #scxml-transitions-body').off('click.scxml-actions').on('click.scxml-actions', '.scxml-edit-actions', function (e) {
      e.preventDefault();
      openActionEditor(node, $(this).attr('data-kind'), $(this).attr('data-id'), $(this).attr('data-field'));
    });
  }


  var editorSessions = new Map();

  function editorLang() {
    return (RED.i18n && RED.i18n.lang && RED.i18n.lang()) || 'zh-CN';
  }

  function docFromNode(node) {
    var c = core();
    var raw = node && typeof node.doc === 'string' ? node.doc.trim() : '';
    if (raw) {
      try { return c.normalizeDoc(JSON.parse(raw)); } catch (err) { /* fall through to source */ }
    }
    if (node && typeof node.source === 'string' && node.source.trim()) {
      try {
        return c.normalizeDoc(c.scxmlToDoc(node.source, window.DOMParser ? new DOMParser() : undefined).doc);
      } catch (err) { /* fall through to empty doc */ }
    }
    return c.emptyDoc((node && node.name) || 'state machine');
  }

  function collectMachines(currentNode, currentDoc) {
    var c = core();
    var list = [];
    RED.nodes.eachConfig(function (config) {
      if (!config || config.type !== 'statechart-machine') return;
      var machineDoc = null;
      try { machineDoc = docFromNode(config); } catch (err) { machineDoc = null; }
      if (!machineDoc) machineDoc = c.emptyDoc(config.name || 'state machine');
      list.push({ id: config.id, name: config.name || config.id, doc: JSON.parse(JSON.stringify(machineDoc)) });
    });
    if (currentNode) {
      var current = null;
      for (var i = 0; i < list.length; i++) if (list[i].id === currentNode.id) current = list[i];
      var doc = currentDoc || docFromNode(currentNode);
      if (current) current.doc = JSON.parse(JSON.stringify(doc));
      else list.push({ id: currentNode.id, name: currentNode.name || currentNode.id, doc: JSON.parse(JSON.stringify(doc)) });
    }
    return list;
  }

  function editorUrl(id) {
    var root = (RED.settings.httpAdminRoot || '/').replace(/\/?$/, '/');
    return root + 'statechart/editor/?nodered=1&id=' + encodeURIComponent(id) +
      '&host=top&lang=' + encodeURIComponent(editorLang()) +
      '&token=' + encodeURIComponent(window.scxmlToken || '');
  }

  function findSessionByMachine(id) {
    var found = null;
    editorSessions.forEach(function (session) {
      if (found || session.id !== id) return;
      if (session.win && !session.win.closed) found = session;
      else editorSessions.delete(session.win);
    });
    return found;
  }

  function postToEditor(session, message) {
    if (!session || !session.win || session.win.closed) return false;
    try {
      session.win.postMessage(message, location.origin);
      return true;
    } catch (err) {
      // The editor window may have closed between the check and the post.
      return false;
    }
  }

  function postToSource(source, message) {
    try {
      if (source) source.postMessage(message, location.origin);
    } catch (err) {
      // The window is gone; nothing else to do.
    }
  }

  function sendEditorLoad(session) {
    if (!session || !session.node) return;
    var doc = session.dialogDoc || docFromNode(session.node);
    // The config node name is the user-facing machine name; keep the document
    // name in sync when the editor is opened from the sidebar.
    if (!session.dialogDoc && session.node && session.node.name) doc.name = session.node.name;
    var machines = collectMachines(session.node, doc);
    postToEditor(session, {
      type: 'scxml:load',
      id: session.id,
      currentId: session.id,
      doc: JSON.parse(JSON.stringify(doc)),
      machines: machines,
      lang: editorLang(),
    });
    session.loaded = true;
  }

  function saveEditorDoc(session, doc) {
    var c = core();
    if (!c || !doc || typeof doc !== 'object') return { ok: false, error: 'invalid document' };
    var targetId = session.id;
    var target = session.isEditingSelf
      ? session.node
      : ((RED.nodes.node && RED.nodes.node(targetId)) || null);
    if (!target || target.id !== targetId || target.type !== 'statechart-machine') {
      return { ok: false, error: 'machine not found' };
    }
    var incomingName = typeof doc.name === 'string' ? doc.name.trim() : '';
    target.doc = JSON.stringify(doc);
    try {
      target.source = c.serializeToScxml(doc);
    } catch (err) {
      // Keep the previous source; doc remains authoritative.
    }
    if (incomingName) {
      target.name = incomingName;
      if (session.isEditingSelf && typeof $ === 'function') $('#node-config-input-name').val(incomingName);
    }
    if (session.isEditingSelf) {
      target._scxmlEditor = target._scxmlEditor || {};
      target._scxmlEditor.doc = c.normalizeDoc(JSON.parse(JSON.stringify(doc)));
      if (typeof scxmlPrepareMachineEditor === 'function') scxmlPrepareMachineEditor(target);
    }
    if (RED.nodes && RED.nodes.dirty) RED.nodes.dirty(true);
    notify(session.isEditingSelf ? t('message.savedFromFullEditor') : (target.name || targetId), 'success');
    return { ok: true, machine: target };
  }

  function openEditorSession(node, dialogDoc) {
    var existing = findSessionByMachine(node.id);
    if (existing) {
      if (existing.win && !existing.win.closed) existing.win.focus();
      notify(t('message.editorAlreadyOpen'), 'warning');
      return;
    }
    if (!window.scxmlToken) {
      if (typeof scxmlFetchToken === 'function') {
        scxmlFetchToken(function () { openEditorSession(node, dialogDoc); });
      } else {
        notify(t('message.tokenUnavailable'), 'error');
      }
      return;
    }
    var win = window.open(editorUrl(node.id), '_blank');
    if (!win) {
      notify(t('message.popupBlocked'), 'warning');
      return;
    }
    var session = {
      id: node.id,
      node: node,
      isEditingSelf: !!dialogDoc,
      dialogDoc: dialogDoc || null,
      win: win,
      loaded: false,
    };
    editorSessions.set(win, session);
    // The child normally sends scxml:ready; this is the fallback for a slow
    // script load and mirrors the previous 800ms behaviour.
    setTimeout(function () {
      if (!session.loaded) sendEditorLoad(session);
    }, 1000);
  }

  function onEditorMessage(event) {
    if (event.origin !== location.origin) return;
    var data = event.data || {};
    if (!data || typeof data !== 'object') return;
    if (data.type === 'scxml:ready') {
      if (typeof data.id !== 'string' || !data.id) return;
      var session = editorSessions.get(event.source);
      if (!session) {
        var node = (RED.nodes.node && RED.nodes.node(data.id)) || null;
        if (!node || node.type !== 'statechart-machine') {
          notify(t('message.machineNotFound'), 'error');
          return;
        }
        session = { id: data.id, node: node, isEditingSelf: false, dialogDoc: null, win: event.source, loaded: false };
        editorSessions.set(event.source, session);
      }
      if (session.win !== event.source) session.win = event.source;
      sendEditorLoad(session);
      return;
    }
    if (data.type === 'scxml:save' && data.doc) {
      var current = editorSessions.get(event.source);
      if (!current) {
        var target = (data.id && RED.nodes.node && RED.nodes.node(data.id)) || null;
        if (!target || target.type !== 'statechart-machine') {
          postToSource(event.source, { type: 'scxml:save-ack', ok: false, error: 'machine not found' });
          notify(t('message.machineNotFound'), 'error');
          return;
        }
        current = { id: data.id, node: target, isEditingSelf: false, dialogDoc: null, win: event.source, loaded: true };
        editorSessions.set(event.source, current);
      }
      var result = saveEditorDoc(current, data.doc);
      var ack = { type: 'scxml:save-ack', ok: result.ok };
      if (result.error) ack.error = result.error;
      postToSource(event.source, ack);
      if (!result.ok) notify(t('message.machineNotFound'), 'error');
    }
  }

  function openFullEditor(node) {
    var c = core();
    var doc = node._scxmlEditor && node._scxmlEditor.doc;
    if (!doc) {
      try {
        doc = node.source && String(node.source).trim() ? c.scxmlToDoc(node.source).doc : c.emptyDoc(node.name || 'state machine');
      } catch (err) {
        notify(t('message.scxmlImportFailed', { error: err && err.message ? err.message : err }), 'error');
        return;
      }
    }
    doc = c.normalizeDoc(JSON.parse(JSON.stringify(doc)));
    // The dialog's Name field may be edited but not saved yet; prefer it.
    var dialogName = $('#node-config-input-name').val();
    if (dialogName) doc.name = dialogName;
    else if (node.name) doc.name = node.name;
    openEditorSession(node, doc);
  }

  window.addEventListener('message', onEditorMessage);

  function render(node) {
    var c = core();
    var editor = node._scxmlEditor;
    if (!c || !editor) return;
    var doc = editor.doc;
    $('#scxml-states-body').html(renderStates(doc));
    $('#scxml-transitions-body').html(renderTransitions(doc));
    $('#scxml-events-body').html(renderEvents(doc));
    $('#scxml-vars-body').html(renderVars(doc));

    var html = '<option value="">' + esc(t('form.none')) + '</option>';
    doc.states.forEach(function (s) {
      if (s.parent) return;
      html += '<option value="' + esc(s.uid) + '"' + (s.uid === doc.initial ? ' selected' : '') + '>' + esc(s.id) + '</option>';
    });
    $('#scxml-root-initial').html(html);
    $('#scxml-doc-json').val(JSON.stringify(doc, null, 2));
    $('#node-config-input-doc').val(JSON.stringify(doc));
    renderIssues(node);
  }

  function addState(node) {
    var c = core();
    var doc = node._scxmlEditor.doc;
    var state = {
      uid: c.newUid('s'),
      id: c.uniqueStateId(doc, 'state'),
      label: '',
      kind: 'atomic',
      parent: null,
      initial: null,
      entryActions: [],
      exitActions: [],
    };
    state.label = state.id;
    doc.states.push(state);
    ensureInitial(doc, state.parent);
    render(node);
  }

  function addTransition(node) {
    var c = core();
    var doc = node._scxmlEditor.doc;
    if (doc.states.length < 2) {
      notify(t('message.atLeastTwoStates'), 'warning');
      return;
    }
    doc.transitions.push({
      id: c.newTransitionId(),
      source: doc.states[0].uid,
      target: doc.states[1].uid,
      event: 'go',
      cond: '',
      actions: [],
    });
    render(node);
  }

  function addVar(node) {
    var doc = node._scxmlEditor.doc;
    doc.datamodel = doc.datamodel || [];
    var n = doc.datamodel.length + 1;
    var ids = {};
    doc.datamodel.forEach(function (v) { ids[v.id] = true; });
    while (ids['v' + n]) n++;
    doc.datamodel.push({ id: 'v' + n, expr: '0' });
    render(node);
  }

  function bind(node) {
    var c = core();
    $('#scxml-states-body').off('.scxml').on('change.scxml', '[data-field]', function () {
      var uid = $(this).closest('tr').attr('data-uid');
      var state = stateById(node._scxmlEditor.doc, uid);
      if (!state) return;
      var field = $(this).attr('data-field');
      var value = $(this).val();
      var oldParent = state.parent;
      if (field === 'entry') state.entryActions = lines(value);
      else if (field === 'exit') state.exitActions = lines(value);
      else if (field === 'parent') state.parent = value || null;
      else if (field === 'initial') state.initial = value || null;
      else if (field === 'kind') {
        state.kind = value;
        if (value !== 'compound') state.initial = null;
      } else if (field === 'id') {
        state.id = value;
        state.label = value;
      }
      if (field === 'parent') {
        ensureInitial(doc, oldParent);
        ensureInitial(doc, state.parent);
      } else if (field === 'kind') {
        ensureInitial(doc, state.parent);
      }
      if (field === 'parent' || field === 'kind') render(node);
      else renderIssues(node);
    });

    $('#scxml-transitions-body').off('.scxml').on('change.scxml', '[data-field]', function () {
      var id = $(this).closest('tr').attr('data-id');
      var doc = node._scxmlEditor.doc;
      var t = null;
      for (var i = 0; i < doc.transitions.length; i++) if (doc.transitions[i].id === id) t = doc.transitions[i];
      if (!t) return;
      var field = $(this).attr('data-field');
      var value = $(this).val();
      if (field === 'source') t.source = value;
      else if (field === 'target') t.target = value === '__internal__' || value === '' ? null : value;
      else if (field === 'event') t.event = value;
      else if (field === 'cond') t.cond = value;
      else if (field === 'actions') t.actions = lines(value);
      else if (field === 'delayMs') {
        var delay = Number(value);
        t.delayMs = Number.isFinite(delay) && delay > 0 ? delay : undefined;
      }
      renderIssues(node);
    });

    $('#scxml-events-body').off('.scxml').on('change.scxml', '[data-field=visibility]', function () {
      var name = $(this).closest('tr').attr('data-event');
      var doc = node._scxmlEditor.doc;
      if (!name) return;
      core().setInternalOnlyEvent(doc, name, $(this).val() === 'internal');
      render(node);
    });

    $('#scxml-vars-body').off('.scxml').on('change.scxml', '[data-field]', function () {
      var index = Number($(this).closest('tr').attr('data-index'));
      var doc = node._scxmlEditor.doc;
      var v = doc.datamodel && doc.datamodel[index];
      if (!v) return;
      var field = $(this).attr('data-field');
      if (field === 'id') v.id = $(this).val();
      else if (field === 'expr') v.expr = $(this).val();
      renderIssues(node);
    });

    $('#scxml-root-initial').off('.scxml').on('change.scxml', function () {
      node._scxmlEditor.doc.initial = $(this).val() || null;
      render(node);
    });

    $('#scxml-add-state').off('.scxml').on('click.scxml', function (e) { e.preventDefault(); addState(node); });
    $('#scxml-add-transition').off('.scxml').on('click.scxml', function (e) { e.preventDefault(); addTransition(node); });
    $('#scxml-add-var').off('.scxml').on('click.scxml', function (e) { e.preventDefault(); addVar(node); });

    $('#scxml-states-body').on('click.scxml', '.scxml-delete', function (e) {
      e.preventDefault();
      var uid = $(this).attr('data-uid');
      if (!window.confirm(t('message.confirmDeleteState'))) return;
      var doc = node._scxmlEditor.doc;
      var remove = {};
      remove[uid] = true;
      c.descendantsOf(doc, uid).forEach(function (x) { remove[x] = true; });
      doc.states = doc.states.filter(function (s) { return !remove[s.uid]; });
      doc.transitions = doc.transitions.filter(function (t) { return !remove[t.source] && !remove[t.target]; });
      ensureInitial(doc, null);
      var affectedParents = {};
      doc.states.forEach(function (s) { if (s.parent) affectedParents[s.parent] = true; });
      Object.keys(affectedParents).forEach(function (uid) { ensureInitial(doc, uid); });
      render(node);
    });

    $('#scxml-transitions-body').on('click.scxml', '.scxml-delete', function (e) {
      e.preventDefault();
      var id = $(this).attr('data-id');
      var doc = node._scxmlEditor.doc;
      doc.transitions = doc.transitions.filter(function (t) { return t.id !== id; });
      render(node);
    });

    $('#scxml-vars-body').on('click.scxml', '.scxml-delete', function (e) {
      e.preventDefault();
      var index = Number($(this).attr('data-index'));
      var doc = node._scxmlEditor.doc;
      if (doc.datamodel) doc.datamodel.splice(index, 1);
      render(node);
    });

    $('#scxml-apply-json').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      try {
        var parsed = JSON.parse($('#scxml-doc-json').val());
        node._scxmlEditor.doc = c.normalizeDoc(parsed);
        render(node);
      } catch (err) {
        notify(t('message.invalidJson', { error: err && err.message ? err.message : err }), 'error');
      }
    });

    $('#scxml-export-json').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      $('#scxml-doc-json').val(JSON.stringify(node._scxmlEditor.doc, null, 2));
    });

    $('#scxml-import-scxml').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      try {
        var result = c.scxmlToDoc($('#node-config-input-source').val(), window.DOMParser ? new DOMParser() : undefined);
        node._scxmlEditor.doc = c.normalizeDoc(result.doc);
        if (result.warnings && result.warnings.length) notify(result.warnings.join('; '), 'warning');
        render(node);
      } catch (err) {
        notify(t('message.scxmlImportFailed', { error: err && err.message ? err.message : err }), 'error');
      }
    });

    $('#node-config-input-open-full-editor').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      openFullEditor(node);
    });

    $('#scxml-export-scxml').off('.scxml').on('click.scxml', function (e) {
      e.preventDefault();
      try {
        $('#node-config-input-source').val(c.serializeToScxml(node._scxmlEditor.doc));
      } catch (err) {
        notify(t('message.scxmlExportFailed', { error: err && err.message ? err.message : err }), 'error');
      }
    });

    bindActionEditor(node);
  }

  function prepare(node) {
    var c = core();
    if (!c) {
      notify(t('message.coreMissing'), 'error');
      return;
    }
    var doc = null;
    var rawDoc = typeof node.doc === 'string' ? node.doc.trim() : '';
    if (rawDoc) {
      try {
        doc = c.normalizeDoc(JSON.parse(rawDoc));
      } catch (err) {
        notify(t('message.docParseFailed', { error: err && err.message ? err.message : err }), 'warning');
      }
    }
    if (!doc && typeof node.source === 'string' && node.source.trim()) {
      try {
        var imported = c.scxmlToDoc(node.source, window.DOMParser ? new DOMParser() : undefined);
        doc = c.normalizeDoc(imported.doc);
        if (imported.warnings && imported.warnings.length) notify(imported.warnings.join('; '), 'warning');
      } catch (err) {
        notify(t('message.scxmlImportFailed', { error: err && err.message ? err.message : err }), 'error');
      }
    }
    if (!doc) doc = c.emptyDoc(node.name || 'state machine');
    // The Node-RED config-node name is the user-facing machine name; keep the
    // ProjectDoc/SCXML name in sync so the editor header and exports agree.
    if (node.name) doc.name = node.name;
    if (!node.updateEvent) node.updateEvent = 'update';
    $('#node-config-input-updateEvent').val(node.updateEvent);
    // Legacy/imported documents may predate kit 0.13's initial invariant;
    // materialize only the root initial here, leaving compound fallbacks to
    // the serializer and the full editor (import must stay non-destructive).
    ensureInitial(doc, null);
    node._scxmlEditor = { doc: doc };
    bind(node);
    render(node);
  }

  function save(node) {
    var c = core();
    var editor = node._scxmlEditor;
    if (!c || !editor) return;
    var doc;
    try {
      doc = c.normalizeDoc(editor.doc);
    } catch (err) {
      notify(t('message.docNormalizeFailed', { error: err && err.message ? err.message : err }), 'error');
      return;
    }
    editor.doc = doc;
    var nodeName = $('#node-config-input-name').val() || '';
    if (nodeName) doc.name = nodeName;
    var issues = collectIssues(node);
    if (issues.length) {
      notify(t('message.validationSummary', { count: issues.length }), 'warning');
    }
    $('#scxml-editor-errors').empty();
    var serialized = '';
    try {
      serialized = c.serializeToScxml(doc);
    } catch (err) {
      // Keep the previous raw SCXML; the runtime will validate `doc` on deploy.
    }
    // Node-RED config dialogs do not auto-copy hidden inputs into the node.
    // Assign the authoritative fields directly so `oneditsave` actually persists.
    node.doc = JSON.stringify(doc);
    if (serialized) node.source = serialized;
    node.name = nodeName;
    node.engine = $('#node-config-input-engine').val() || 'sandboxed';
    node.scriptTimeoutMs = Number($('#node-config-input-scriptTimeoutMs').val()) || 500;
    node.maxMicrosteps = Number($('#node-config-input-maxMicrosteps').val()) || 10000;
    node.monitorShowVars = $('#node-config-input-monitorShowVars').prop('checked') === true;
    node.persistVars = $('#node-config-input-persistVars').prop('checked') === true;
    node.updateEvent = $('#node-config-input-updateEvent').val() || 'update';
    $('#node-config-input-doc').val(node.doc);
    if (serialized) $('#node-config-input-source').val(serialized);
  }

  window.scxmlPrepareMachineEditor = prepare;
  window.scxmlSaveMachineEditor = save;
})();

</script>
