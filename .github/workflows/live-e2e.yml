name: live-e2e

# Browser + real-Node-RED suites. Manual and weekly to keep PR CI fast and
# deterministic; the unit/typecheck/release gate stays in ci.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Check Firefox
        run: firefox --version

      - name: Install geckodriver
        run: |
          VERSION=0.37.1
          curl -fsSL "https://github.com/mozilla/geckodriver/releases/download/v${VERSION}/geckodriver-v${VERSION}-linux64.tar.gz" -o /tmp/geckodriver.tar.gz
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp
          sudo install -m 0755 /tmp/geckodriver /usr/local/bin/geckodriver
          geckodriver --version

      - name: Live suites (browser, server E2E, cascade)
        env:
          GECKODRIVER: geckodriver
        run: npm run test:live

      - name: Upload Node-RED log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-red-live-log
          path: .tmp/live-nodered/node-red.log
          if-no-files-found: ignore
