name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.9.0', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Prepare statechart-kit
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/changzhen976/statechart-kit.git ../statechart-kit
          npm --prefix ../statechart-kit ci --no-audit --no-fund
          npm --prefix ../statechart-kit run build

      - name: Install
        run: npm ci

      - name: Kit dependency check
        run: npm run check:kit

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Release package check
        run: npm run release:check
